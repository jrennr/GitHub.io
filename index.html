<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="author" content="Jennifer Reevey">
  <meta name="description" content="A public data visualization project by Jennifer Reevey, developer and author of Trustworthy AI Engineering with Python.">
  <meta name="keywords" content="Jennifer Reevey, J. Reevey, software developer, data visualization, JavaScript, Trustworthy AI Engineering with Python">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Belly Button Biodiversity | Jennifer Reevey">

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">

<body>

  <div class="container">
    <div class="row">
      <div class="col-md-12 jumbotron text-center">
        <h1>Belly Button Biodiversity Dashboard</h1>
        <p>Use the interactive charts below to explore the dataset</p>
      </div>
    </div>
    <div class="row">
      <div class="col-md-2">
        <div class="well">
          <h5>Test Subject ID No.:</h5>
          <select id="selDataset" onchange="optionChanged(this.value)"></select>
        </div>
        <div class="panel panel-primary">
          <div class="panel-heading">
            <h3 class="panel-title">Demographic Info</h3>
          </div>
          <div id="sample-metadata" class="panel-body"></div>
        </div>
      </div>
      <div class="col-md-5">
        <div id="bar"></div>
      </div>
      <div class="col-md-5">
        <div id="gauge"></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div id="bubble"></div>
      </div>
    </div>

    <footer class="text-center" style="margin: 32px 0 24px;">
      <p>
        Project by <a href="https://jenniferreevey.dev/" rel="author">Jennifer Reevey</a>
        &middot;
        Author of
        <a href="https://books.google.com/books/about/Trustworthy_AI_Engineering_with_Python.html?id=asATEgAAQBAJ" rel="noopener">
          <em>Trustworthy AI Engineering with Python</em>
        </a>
      </p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.5.0/d3.js"></script>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="charts.js"></script>

</body>

</html>
